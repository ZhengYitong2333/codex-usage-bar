<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage Bar</title>
  <desc id="desc">Know your limits. Keep your flow. A macOS menu bar quota monitor. All shown values are fictional demonstration data.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#233d32" opacity=".10"/></pattern>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#173e2e" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1280" height="650" rx="24" fill="#f4f2eb"/>
  <rect width="1280" height="650" rx="24" fill="url(#grid)"/>
  <circle cx="1070" cy="245" r="245" fill="#dce6d7"/>
  <circle cx="1070" cy="245" r="204" fill="none" stroke="#c4d2bc"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="66" y="62" width="34" height="34" rx="10" fill="#236047"/>
    <path d="M75 79h16M83 71v16" stroke="#f4f2eb" stroke-width="2" stroke-linecap="round"/>
    <text x="114" y="85" font-size="18" font-weight="600" fill="#244334" letter-spacing="2">CODEX USAGE BAR</text>
    <text x="65" y="227" font-family="Georgia,'Times New Roman',serif" font-size="70" fill="#183f2f" letter-spacing="-3">Know your limits.</text>
    <text x="65" y="312" font-family="Georgia,'Times New Roman',serif" font-size="70" fill="#183f2f" letter-spacing="-3">Keep your flow.</text>
    <text x="68" y="371" font-size="20" fill="#58685c">Your Codex quota. Right in the menu bar.</text>
    <g font-size="13" font-family="Menlo,Consolas,monospace" fill="#244334">
      <text x="69" y="461">LIVE QUOTAS</text><text x="224" y="461">LOCAL FALLBACK</text><text x="410" y="461">NATIVE SETTINGS</text>
    </g>
    <path d="M68 485h570" stroke="#cbd2c6"/>
    <text x="68" y="531" font-size="14" fill="#58685c">macOS 13+  /  SwiftUI  /  Python standard library</text>
    <text x="68" y="591" font-size="12" fill="#6a786d" letter-spacing="1.5">OPEN SOURCE · MIT LICENSE</text>
    <g filter="url(#shadow)">
      <rect x="755" y="73" width="412" height="39" rx="12" fill="#e6e9df"/>
      <rect x="973" y="78" width="66" height="29" rx="7" fill="#cfdac7"/>
      <text x="986" y="90" font-size="9" fill="#254333">Codex</text>
      <text x="987" y="102" font-size="12" font-weight="600" fill="#254333">82%</text>
      <text x="1061" y="98" font-size="12" fill="#4a5a4e">10:24</text>
      <rect x="755" y="125" width="412" height="445" rx="18" fill="#242925"/>
    </g>
    <text x="781" y="163" font-size="16" font-weight="600" fill="#f0f4ed">Codex</text>
    <text x="1080" y="162" font-size="10" fill="#abb8a9" letter-spacing="1">DEMO</text>
    <text x="781" y="209" font-size="12" fill="#b7c5b4" letter-spacing="1.5">WEEKLY QUOTA</text>
    <text x="780" y="272" font-size="54" font-weight="500" fill="#f0f4ed">82<tspan font-size="25">%</tspan><tspan dx="14" font-size="15" fill="#b7c5b4">remaining</tspan></text>
    <rect x="782" y="294" width="358" height="6" rx="3" fill="#434e42"/>
    <rect x="782" y="294" width="294" height="6" rx="3" fill="#a4d39a"/>
    <text x="782" y="329" font-size="13" fill="#b7c5b4">Resets in 4d 8h</text>
    <path d="M781 354h359" stroke="#424b40"/>
    <text x="781" y="386" font-size="13" fill="#e7eee3">5-hour quota</text>
    <text x="1140" y="386" text-anchor="end" font-size="13" fill="#e7eee3">63% remaining</text>
    <rect x="782" y="403" width="358" height="4" rx="2" fill="#434e42"/>
    <rect x="782" y="403" width="226" height="4" rx="2" fill="#a4d39a"/>
    <text x="782" y="435" font-size="12" fill="#b7c5b4">Usage &amp; record details</text>
    <text x="1138" y="435" text-anchor="end" font-size="16" fill="#b7c5b4">›</text>
    <path d="M781 453h359" stroke="#424b40"/>
    <text x="782" y="484" font-size="13" fill="#f0f4ed">Refresh quota</text>
    <text x="782" y="515" font-size="13" fill="#f0f4ed">Settings…</text>
    <text x="782" y="547" font-size="11" fill="#a0ae9d">API-backed · automatic refresh</text>
    <text x="960" y="602" text-anchor="middle" font-size="11" fill="#657761">Illustrative preview · all values are fictional</text>
  </g>
</svg>
